name: Verify portfolio outputs

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run enterprise RCM pipeline
        run: python run_pipeline.py
      - name: Regenerate BA portfolio data and assert headline figures
        run: python 02_denial_analysis/src/verify_outputs.py
      - name: Execute denial EDA notebook
        run: |
          jupyter nbconvert --to notebook --execute \
            02_denial_analysis/notebooks/02_denial_eda.ipynb \
            --stdout > /dev/null
